<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>ファイルアップロード</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			min-height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			padding: 20px;
		}

		.container {
			background: white;
			border-radius: 20px;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
			padding: 40px;
			max-width: 600px;
			width: 100%;
		}

		h1 {
			color: #333;
			margin-bottom: 30px;
			text-align: center;
		}

		.drop-zone {
			border: 3px dashed #667eea;
			border-radius: 15px;
			padding: 60px 20px;
			text-align: center;
			cursor: pointer;
			transition: all 0.3s ease;
			background: #f8f9ff;
		}

		.drop-zone:hover {
			border-color: #764ba2;
			background: #f0f1ff;
		}

		.drop-zone.drag-over {
			border-color: #764ba2;
			background: #e8e9ff;
			transform: scale(1.02);
		}

		.drop-zone-icon {
			font-size: 64px;
			margin-bottom: 20px;
		}

		.drop-zone-text {
			color: #666;
			font-size: 18px;
			margin-bottom: 10px;
		}

		.drop-zone-hint {
			color: #999;
			font-size: 14px;
		}

		.file-input {
			display: none;
		}

		.file-list {
			margin-top: 30px;
		}

		.file-item {
			background: #f8f9ff;
			border-radius: 10px;
			padding: 15px;
			margin-bottom: 10px;
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.file-info {
			flex: 1;
		}

		.file-name {
			font-weight: 600;
			color: #333;
			margin-bottom: 5px;
		}

		.file-size {
			color: #999;
			font-size: 14px;
		}

		.file-status {
			padding: 5px 15px;
			border-radius: 20px;
			font-size: 14px;
			font-weight: 600;
		}

		.status-uploading {
			background: #fff3cd;
			color: #856404;
		}

		.status-success {
			background: #d4edda;
			color: #155724;
		}

		.status-error {
			background: #f8d7da;
			color: #721c24;
		}

		.progress-bar {
			width: 100%;
			height: 4px;
			background: #e0e0e0;
			border-radius: 2px;
			margin-top: 10px;
			overflow: hidden;
		}

		.progress-fill {
			height: 100%;
			background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
			transition: width 0.3s ease;
		}

		.upload-button {
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			color: white;
			border: none;
			border-radius: 10px;
			padding: 15px 30px;
			font-size: 16px;
			font-weight: 600;
			cursor: pointer;
			width: 100%;
			margin-top: 20px;
			transition: transform 0.2s ease;
		}

		.upload-button:hover {
			transform: translateY(-2px);
		}

		.upload-button:disabled {
			opacity: 0.5;
			cursor: not-allowed;
			transform: none;
		}
	</style>
</head>

<body>
	<div class="container">
		<h1>📤 ファイルアップロード</h1>

		<div class="drop-zone" id="dropZone">
			<div class="drop-zone-icon">📁</div>
			<div class="drop-zone-text">ここにファイルをドラッグ&ドロップ</div>
			<div class="drop-zone-hint">または、クリックしてファイルを選択</div>
		</div>

		<input type="file" id="fileInput" class="file-input" multiple />

		<div class="file-list" id="fileList"></div>

		<button class="upload-button" id="uploadButton" disabled>アップロード</button>
	</div>

	<script>
		const dropZone = document.getElementById('dropZone');
		const fileInput = document.getElementById('fileInput');
		const fileList = document.getElementById('fileList');
		const uploadButton = document.getElementById('uploadButton');
		let selectedFiles = [];

		// ドロップゾーンクリックでファイル選択
		dropZone.addEventListener('click', () => {
			fileInput.click();
		});

		// ファイル選択時の処理
		fileInput.addEventListener('change', (e) => {
			handleFiles(e.target.files);
		});

		// ドラッグオーバー
		dropZone.addEventListener('dragover', (e) => {
			e.preventDefault();
			dropZone.classList.add('drag-over');
		});

		// ドラッグ離脱
		dropZone.addEventListener('dragleave', () => {
			dropZone.classList.remove('drag-over');
		});

		// ドロップ
		dropZone.addEventListener('drop', (e) => {
			e.preventDefault();
			dropZone.classList.remove('drag-over');
			handleFiles(e.dataTransfer.files);
		});

		// ファイル処理
		function handleFiles(files) {
			selectedFiles = Array.from(files);
			displayFiles();
			uploadButton.disabled = selectedFiles.length === 0;
		}

		// ファイル一覧表示
		function displayFiles() {
			fileList.innerHTML = '';
			selectedFiles.forEach((file, index) => {
				const fileItem = document.createElement('div');
				fileItem.className = 'file-item';
				fileItem.innerHTML = `
						<div class="file-info">
							<div class="file-name">${file.name}</div>
							<div class="file-size">${formatFileSize(file.size)}</div>
							<div class="progress-bar" id="progress-${index}" style="display: none;">
								<div class="progress-fill" id="progress-fill-${index}" style="width: 0%"></div>
							</div>
						</div>
						<div class="file-status" id="status-${index}">待機中</div>
					`;
				fileList.appendChild(fileItem);
			});
		}

		// ファイルサイズフォーマット
		function formatFileSize(bytes) {
			if (bytes === 0) return '0 Bytes';
			const k = 1024;
			const sizes = ['Bytes', 'KB', 'MB', 'GB'];
			const i = Math.floor(Math.log(bytes) / Math.log(k));
			return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
		}

		// アップロード処理
		uploadButton.addEventListener('click', async () => {
			uploadButton.disabled = true;

			for (let i = 0; i < selectedFiles.length; i++) {
				const file = selectedFiles[i];
				const statusEl = document.getElementById(`status-${i}`);
				const progressBar = document.getElementById(`progress-${i}`);
				const progressFill = document.getElementById(`progress-fill-${i}`);

				try {
					statusEl.textContent = 'アップロード中...';
					statusEl.className = 'file-status status-uploading';
					progressBar.style.display = 'block';

					const response = await fetch('/api/upload', {
						method: 'POST',
						headers: {
							'Content-Type': file.type,
						},
						body: file,
					});

					progressFill.style.width = '100%';

					if (response.ok) {
						const result = await response.json();
						statusEl.textContent = '✓ 完了';
						statusEl.className = 'file-status status-success';
					} else {
						throw new Error('アップロード失敗');
					}
				} catch (error) {
					statusEl.textContent = '✗ エラー';
					statusEl.className = 'file-status status-error';
				}
			}

			uploadButton.disabled = false;
		});
	</script>
</body>

</html>
